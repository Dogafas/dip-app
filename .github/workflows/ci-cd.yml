name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

env:
  IMAGE_NAME: datadynamo/dip-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Extract release version
        id: vars
        run: |
          RAW_VER="${GITHUB_REF#refs/tags/}"
          CLEAN_VER="${RAW_VER#v}"
          echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy new version to Kubernetes
        run: |
          kubectl set image deployment/dip-app dip-app=${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION }}
          kubectl rollout status deployment/dip-app --timeout=120s

      - name: Verify deployment pods
        run: |
          kubectl get pods -l app=dip-app -o wide