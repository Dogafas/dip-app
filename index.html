<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diploma Practice: DevOps Application</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 32px 48px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 20px;
            background-color: #238636;
            color: #ffffff;
            margin-bottom: 24px;
        }
        .info-table {
            width: 100%;
            margin-top: 16px;
            border-collapse: collapse;
            text-align: left;
        }
        .info-table td {
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
        }
        .info-table td.label {
            color: #8b949e;
            font-weight: 500;
        }
        .info-table td.value {
            text-align: right;
            font-family: monospace;
            color: #79c0ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diploma DevOps Project</h1>
        <div class="badge">Status: Running</div>
        <table class="info-table">
            <tr>
                <td class="label">Environment:</td>
                <td class="value">Stage / Yandex Cloud</td>
            </tr>
            <tr>
                <td class="label">Cluster:</td>
                <td class="value">Kubernetes v1.28</td>
            </tr>
            <tr>
                <td class="label">Application:</td>
                <td class="value">Nginx Static App</td>
            </tr>
            <tr>
                <td class="label">App Version:</td>
                <td class="value">v1.0.0</td>
            </tr>
        </table>
    </div>
</body>
</html>
